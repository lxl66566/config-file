[package]
authors       = ["Marc-Antoine Perennou <Marc-Antoine@Perennou.com>", "lxl66566 <lxl66566@gmail.com>"]
categories    = ["config"]
description   = "Extremely easy to read and write configuration file"
documentation = "https://docs.rs/config-file2"
edition       = "2024"
exclude       = [".github", ".vscode"]
keywords      = ["config", "configuration"]
license       = "BSD-2-Clause"
name          = "config-file2"
repository    = "https://github.com/lxl66566/config-file"
version       = "0.6.0"

[lib]
name = "config_file2"

[features]
all     = ["default", "atomic", "json", "json5", "toml", "xml", "yaml", "ron"]
atomic  = ["dep:tempfile"]
default = ["toml", "atomic"]
json    = ["serde_json"]
json5   = ["json_five"]
ron     = ["ron_crate"]
toml    = ["toml_crate"]
xml     = ["quick-xml"]
yaml    = ["yaml_serde"]

[dependencies]
json_five  = { version = "0.3", optional = true, package = "json-five" }
quick-xml  = { version = "0.40", features = ["serialize"], optional = true }
ron_crate  = { version = "0.12", optional = true, package = "ron" }
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
tempfile   = { version = "3.19", optional = true }
thiserror  = "2.0"
toml_crate = { version = "1.1.2", optional = true, package = "toml" }
yaml_serde = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3.19"
